# docker/docker-compose.local.yml — override de vérification locale, jamais
# déployé. Il fait trois choses : construire les images au lieu de les
# tirer, publier les ports sur l'hôte, et retirer Traefik du chemin (pas de
# domaine, pas d'ACME, donc pas de certificat à obtenir pour un test).
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.local.yml up --build web admin
services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        PUBLIC_CONVEX_URL: ${PUBLIC_CONVEX_URL:-http://host.docker.internal:3210}
    image: astrotan-web:local
    ports:
      - "4321:4321"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      traefik.enable: "false"

  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://host.docker.internal:3210}
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:-http://host.docker.internal:3211}
        VITE_WEB_SITE_URL: ${VITE_WEB_SITE_URL:-http://localhost:4321}
    image: astrotan-admin:local
    # 3001 côté hôte : le port 3000 est occupé sur la machine de dev.
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      traefik.enable: "false"

  # Umami en local : même image et même base que sur le VPS, publié sur
  # l'hôte et retiré de Traefik. 3002 parce que 3000 est occupé sur la
  # machine de dev et que 3001 est déjà pris par l'admin ci-dessus.
  #
  # Pour l'essayer :
  #   docker compose -f docker/docker-compose.yml \
  #     -f docker/docker-compose.local.yml up -d umami
  #   curl -s -o /dev/null -w 'umami=%{http_code}\n' \
  #     http://127.0.0.1:3002/api/heartbeat
  # puis http://localhost:3002 — identifiants `admin` / `umami`.
  #
  # Ensuite, pour que `apps/web` charge réellement le script, poser dans
  # `apps/web/.env.local` :
  #   PUBLIC_UMAMI_URL=http://localhost:3002
  #   PUBLIC_UMAMI_WEBSITE_ID=<l'id affiché par Umami après « Add website »>
  # Détail et piège du localhost : README §13.
  umami:
    ports:
      - "3002:3000"
    labels:
      traefik.enable: "false"
