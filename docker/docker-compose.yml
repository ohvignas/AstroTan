# docker/docker-compose.yml — ce qui tourne sur le VPS (spec §7).
# Aucune image n'est construite ici : la CI les pousse sur GHCR et ce
# fichier ne fait que les tirer, à un tag précis. C'est ce qui rend le
# rollback exécutable — `IMAGE_TAG` est un sha de commit, pas `latest`.
name: astrotan

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Lecture seule : Traefik n'a besoin que de lire les labels des
      # conteneurs. Un socket Docker monté en écriture équivaut à donner
      # le root de l'hôte au conteneur.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    # NE JAMAIS AJOUTER DE `command:` NI DE `traefik.yml` MONTÉ ICI.
    #
    # Traefik charge sa configuration statique par trois loaders essayés
    # dans l'ordre File → Flag → Env, et le PREMIER qui aboutit arrête la
    # chaîne : les sources ne sont pas fusionnées. Un fichier monté sur
    # `/etc/traefik/traefik.yml`, ou un seul argument de ligne de commande,
    # ferait donc ignorer EN SILENCE toutes les variables `TRAEFIK_*`
    # ci-dessous — Traefik démarrerait sans ACME, sans provider docker et
    # sans redirection, sans le moindre message d'erreur.
    #
    # Vérifié sur traefik:v3.6 (3.6.25) : avec `TRAEFIK_LOG_LEVEL=DEBUG`
    # dans l'environnement et le seul flag `--accesslog=true` en `command`,
    # le conteneur ne produit aucune ligne DBG — le niveau reste au défaut
    # ERROR. Pour ajouter un réglage, ajouter une variable, jamais un flag.
    #
    # Les noms suivent les flags `traefik --help` : `--entrypoints.<nom>.
    # address` devient `TRAEFIK_ENTRYPOINTS_<NOM>_ADDRESS`. Le nom du
    # résolveur (`letsencrypt`) est arbitraire mais doit rester identique
    # aux labels `traefik.http.routers.*.tls.certresolver` plus bas.
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT: "true"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_PROVIDERS_DOCKER: "true"
      # Aucun conteneur n'est exposé sans un label `traefik.enable=true`.
      # Le défaut inverse publierait sur internet tout conteneur de l'hôte.
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: astrotan_edge
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # `/ping` sur l'entrypoint interne `traefik` (port 8080), seule cible
      # du healthcheck ci-dessous. Cet entrypoint n'est pas dans `ports:` :
      # il reste joignable depuis le conteneur seulement. Ni l'API ni le
      # dashboard ne sont activés — un dashboard Traefik ouvert publierait
      # la topologie complète du VPS.
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: traefik
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_ACCESSLOG: "true"
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/astrotan-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    # Un seul réplica, et ce n'est pas un réglage de capacité : le cache
    # d'Astro est `memoryCache()`, par processus. Une seconde instance
    # continuerait de servir du contenu périmé jusqu'à `maxAge` après
    # chaque publication, parce que le POST `/api/revalidate` n'atteint
    # qu'un seul processus (spec §6.2 ; le commentaire final de
    # apps/web/src/pages/api/revalidate.ts). Monter ce nombre exige
    # d'abord un provider de cache partagé.
    deploy:
      replicas: 1
    environment:
      # Secrets d'exécution, jamais dans l'image (contrainte globale) :
      # `.env` du VPS, jamais commité.
      #
      # Ces quatre-là sont exactement les `process.env.*` que le code servi
      # lit au runtime — `src/lib/previewToken.ts`, `pages/api/revalidate.ts`,
      # `pages/api/contact.ts`, `pages/api/consent.ts`. La liste est vérifiée
      # à chaque CI par `node scripts/check-env-wiring.mjs` : en ajouter une
      # dans le code sans l'ajouter ici fait échouer le job, parce que
      # l'oubli inverse a déjà été payé (voir plus bas).
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # Clé HMAC du formulaire de contact, identique à celle posée sur
      # Convex. ABSENTE, `pages/api/contact.ts` refuse CHAQUE envoi et
      # redirige vers `/contact?erreur=indisponible` — le bon comportement de
      # sécurité, et le pire symptôme à diagnostiquer : le formulaire est
      # visible, il accepte la saisie, et il ne marche jamais. D'où le `:?`
      # plutôt qu'un défaut vide : mieux vaut un `compose up` qui refuse de
      # démarrer en nommant la variable qu'un site debout et muet.
      LEAD_SUBMIT_SECRET: ${LEAD_SUBMIT_SECRET:?LEAD_SUBMIT_SECRET is required}
      # Clé HMAC du journal de consentement, elle aussi identique côté
      # Convex. Absente, `pages/api/consent.ts` répond 204 et n'écrit rien —
      # alors que `src/config/consent.ts` pose `traceability.enabled: true`,
      # donc que le navigateur POSTe bel et bien à chaque choix. La trace
      # qu'on croit conserver n'existe alors nulle part, et aucune erreur ne
      # le signale. Même raison pour le `:?` : la panne est silencieuse des
      # deux côtés.
      CONSENT_LOG_SECRET: ${CONSENT_LOG_SECRET:?CONSENT_LOG_SECRET is required}
      # `PUBLIC_CONVEX_URL` n'apparaît pas ici : Astro l'a figée dans le
      # bundle au build (build-arg). La changer impose de reconstruire. Idem
      # pour `PUBLIC_UMAMI_*`, `PUBLIC_META_PIXEL_ID` et
      # `PUBLIC_GOOGLE_TAG_ID` — voir docker/web.Dockerfile.
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: Host(`${WEB_DOMAIN:?WEB_DOMAIN is required}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: letsencrypt
      traefik.http.services.web.loadbalancer.server.port: "4321"

  admin:
    image: ghcr.io/${GHCR_OWNER}/astrotan-admin:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Les mêmes valeurs qu'en build-arg, et pour une autre raison :
      # `src/lib/auth-server.ts` les lit par `process.env` au runtime,
      # tandis que `src/router.tsx` lit la copie figée par Vite. Les deux
      # sont nécessaires (voir docker/admin.Dockerfile, Task 5).
      VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
      VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:?VITE_CONVEX_SITE_URL is required}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: Host(`${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}`)
      traefik.http.routers.admin.entrypoints: websecure
      traefik.http.routers.admin.tls.certresolver: letsencrypt
      traefik.http.services.admin.loadbalancer.server.port: "3000"

  # ── Umami — mesure d'audience auto-hébergée (lot 6, spec §6.5) ──────────
  #
  # Auto-hébergé et pas SaaS pour la même raison que le reste de ce fichier :
  # aucune donnée de visite ne quitte le VPS. Le coût est réel et il est
  # écrit dans le README (§13) : un service de plus à mettre à jour, et une
  # BASE DE DONNÉES de plus à sauvegarder — la première du projet, puisque
  # le contenu vit dans Convex.
  #
  # Deux façons de le retirer si on n'en veut pas : ne pas poser les
  # variables `PUBLIC_UMAMI_*` au build du site (le script n'est alors pas
  # rendu, cf. apps/web/src/components/Analytics.astro), et supprimer les
  # deux services ci-dessous.
  # Redis n'est pas là pour la performance : c'est lui qui rend possible
  # l'arrivée sur Umami en un clic depuis l'administration. La route
  # `POST /api/auth/sso` d'Umami y dépose un jeton à usage unique et à vie
  # courte ; sans Redis elle répond « Redis is disabled » et le bouton
  # « Statistiques » retombe sur le formulaire de connexion.
  #
  # Aucune donnée durable ici : ces jetons expirent en quelques minutes.
  # Le conteneur peut être perdu et recréé sans rien sauvegarder — d'où
  # l'absence de volume, qui est un choix et non un oubli.
  umami-redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    # Pas de persistance sur disque : ce qui est stocké ici est éphémère par
    # nature, et l'écrire ferait des jetons de session un fichier à protéger.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Jamais exposé : seul Umami le joint, par le réseau interne.
    networks: [analytics]

  umami:
    # Tag EXACT, jamais `latest` ni `postgresql-latest` : ces deux alias
    # pointent aujourd'hui sur 3.3.1 et bougeront au prochain amont.
    # Depuis Umami 3, l'image ne porte plus le préfixe `postgresql-` (v3 ne
    # supporte plus que PostgreSQL) ; `postgresql-latest` n'est qu'un alias
    # conservé. Digest vérifié le 2026-08-28 :
    # sha256:fa32d116cf20cad52cbc3fad9a63b46e7fa02299d8f967168eb453d49c476b4a
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    # Next.js n'est pas PID 1 correctement : sans `init`, les signaux
    # d'arrêt ne descendent pas et le conteneur met 10 s à mourir à chaque
    # déploiement. C'est aussi ce que fait le compose officiel d'Umami.
    init: true
    depends_on:
      umami-db:
        condition: service_healthy
      umami-redis:
        condition: service_healthy
    environment:
      # Secrets d'exécution, jamais dans l'image ni en build-arg : ils
      # viennent du `.env` du VPS, qui n'est pas commité.
      #
      # Le mot de passe entre dans une URL : le garder en hexadécimal
      # (`openssl rand -hex 32`) évite d'avoir à l'encoder. Un `@` ou un
      # `/` dans un mot de passe non encodé coupe l'URL en silence et
      # Umami échoue sur un hôte qui n'existe pas.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required}@umami-db:5432/umami
      # Signe les jetons d'authentification d'Umami, y compris celui que
      # `POST /api/auth/login` rend à l'action Convex qui lit les
      # statistiques. Le changer déconnecte tout le monde.
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      # Chiffre les secrets TOTP. Umami REFUSE l'activation de la 2FA sans
      # elle, et la panne n'apparaît qu'au moment où quelqu'un essaie
      # d'activer la 2FA — c'est-à-dire trop tard. On la pose tout de suite.
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY:?UMAMI_TWO_FACTOR_ENCRYPTION_KEY is required}
      # Umami envoie par défaut une télémétrie anonyme à umami.is. Anonyme
      # ou non, c'est une sortie réseau que ce lot dit ne pas faire.
      # Pour couper AUSSI les favicons (récupérés chez DuckDuckGo) et toute
      # autre sortie : ajouter `PRIVATE_MODE: "1"`.
      DISABLE_TELEMETRY: "1"
      # Active `POST /api/auth/sso` : sans elle, cette route répond
      # « Redis is disabled » et l'arrivée en un clic est impossible.
      REDIS_URL: redis://umami-redis:6379
    networks: [edge, analytics]
    healthcheck:
      # `/api/heartbeat` est l'endpoint de santé d'Umami (c'est celui de son
      # compose officiel). `curl` est présent dans l'image ; `wget` ne l'est
      # pas, contrairement aux images `web` et `admin` basées sur Alpine.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Le premier démarrage applique les migrations Prisma et crée le
      # compte `admin` : il est nettement plus long que les autres services.
      start_period: 90s
    labels:
      # EXPOSITION VOLONTAIRE. L'interface d'Umami est une application
      # protégée par mot de passe : elle est publiée sur son propre
      # sous-domaine parce qu'un humain doit pouvoir s'y connecter depuis
      # n'importe où. Ce n'est PAS un oubli.
      # Corollaire non négociable : le compte livré par défaut est
      # `admin` / `umami`, et il faut le changer à la première connexion.
      # Voir README §13.
      traefik.enable: "true"
      traefik.http.routers.umami.rule: Host(`${UMAMI_DOMAIN:?UMAMI_DOMAIN is required}`)
      traefik.http.routers.umami.entrypoints: websecure
      traefik.http.routers.umami.tls.certresolver: letsencrypt
      traefik.http.services.umami.loadbalancer.server.port: "3000"

  # ── Purge de rétention Umami (lot 6, tâche 6) ────────────────────────────
  #
  # `/confidentialite` promet 13 mois de conservation pour les statistiques
  # d'audience. C'est ce service qui rend la promesse vraie : `retention.ts`
  # (Convex) purge déjà `leads` et `consentRecords` sur un cron mensuel
  # (`crons.ts`), mais Umami vit dans son propre PostgreSQL, hors de portée
  # de ce cron — aucun code Convex ne peut l'atteindre. La requête exécutée
  # est `docker/umami-purge.sql` (lu, en détail : elle purge neuf tables,
  # pas seulement `website_event`, parce qu'Umami n'a aucune contrainte de
  # clé étrangère et qu'une purge partielle laisserait des lignes
  # orphelines). Sept est le nombre de tables FILLES ; `session` et
  # `session_replay_saved` s'y ajoutent, purgées non pas sur leur propre âge
  # mais une fois disparue la dernière ligne qui les référençait —
  # `docker/README.md` §13.10 les compte, lui, correctement.
  #
  # `profiles: [purge]` : absent de tout `docker compose up` ordinaire, en
  # développement comme en production — le workflow `Deploy` (README §8)
  # lance `docker compose up -d --wait` sans jamais passer `--profile`, donc
  # ce service n'est ni démarré ni recréé par un déploiement normal.
  # Démarrage volontaire, une seule fois, après le premier déploiement :
  #
  #   docker compose --profile purge up -d umami-purge
  #
  # `restart: unless-stopped` le fait ensuite survivre aux redémarrages de
  # l'hôte. Il ne survit PAS à un `docker compose down` explicite ni à un
  # changement de service qui le recréerait — dans ces cas, le relancer avec
  # la même commande `--profile purge`.
  #
  # Boucle interne plutôt que cron de l'hôte ou service planifié tiers : ce
  # VPS n'a aucune tâche planifiée ailleurs (le seul cron du projet est
  # celui de Convex, ci-dessus), et une boucle `sleep` dans un conteneur déjà
  # présent évite d'ajouter un mécanisme de plus à documenter. Elle purge
  # une fois au démarrage (utile juste après `--profile purge up`, pour ne
  # pas attendre 30 jours avant la première preuve que ça marche), puis tous
  # les 30 jours.
  #
  # Même image que `umami-db` : pas de troisième binaire `psql` à faire
  # confiance, seulement celui déjà vérifié pour parler à cette base.
  umami-purge:
    image: postgres:17.11-alpine
    restart: unless-stopped
    profiles: [purge]
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required}
    volumes:
      - ./umami-purge.sql:/umami-purge.sql:ro
    # Réseau `analytics` uniquement, comme `umami-db` : ce service n'a rien
    # à faire sur `edge`, il ne sert jamais de requête entrante.
    networks: [analytics]
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        while true; do
          echo "[umami-purge] $(date -Iseconds) purge des lignes de plus de 13 mois"
          psql -h umami-db -U umami -d umami -v ON_ERROR_STOP=1 -f /umami-purge.sql
          sleep 2592000
        done

  umami-db:
    # Version majeure ET mineure épinglées. La majeure surtout : un
    # `postgres:17` qui passerait tout seul en 18 refuserait de démarrer sur
    # un répertoire de données écrit par la 17 (`database files are
    # incompatible with server`). Une montée de majeure se fait par
    # dump/restore, jamais par un changement de tag (README §13).
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required}
      # UTC, comme Umami le recommande : un fuseau régional décale les
      # agrégats horaires et le décalage change deux fois par an.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - umami-db:/var/lib/postgresql/data
    # Réseau `analytics` UNIQUEMENT : la base n'est jamais sur `edge`, donc
    # Traefik ne peut pas la voir et elle n'a aucune route vers internet.
    networks: [analytics]
    healthcheck:
      # `depends_on: service_healthy` d'`umami` s'appuie dessus : sans lui,
      # Umami démarre avant Postgres et meurt sur la migration Prisma.
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge:
    name: astrotan_edge
  # Réseau privé de la base d'Umami. `internal: true` lui retire toute
  # route sortante : Postgres n'a rien à faire sur internet, et une base
  # d'analytics est exactement le genre de conteneur qu'on préfère
  # injoignable. Seul `umami` a un pied dans les deux réseaux.
  analytics:
    name: astrotan_analytics
    internal: true

volumes:
  # Stockage des certificats Let's Encrypt (`/acme/acme.json`). Volume
  # NOMMÉ, et pas un bind-mount depuis l'hôte : Traefik refuse de démarrer
  # si le fichier est trop permissif (« permissions 660 for acme.json are
  # too open, please use 600 »), et un fichier créé côté hôte arrive avec
  # les droits et le propriétaire de l'hôte, pas ceux attendus dans le
  # conteneur. Le volume nommé laisse Traefik créer le fichier lui-même,
  # en 600, sans intervention.
  #
  # Sa persistance est aussi ce qui protège le quota Let's Encrypt : sans
  # elle, un conteneur qui redémarre en boucle redemanderait un certificat
  # à chaque tour et brûlerait les 5 certificats/7 jours en quelques
  # minutes. Ne pas le supprimer pour « repartir propre » (voir
  # `ACME_CA_SERVER` dans `.env.example` pour tester sans risque).
  acme:

  # Les données d'audience d'Umami. C'est le PREMIER volume applicatif du
  # projet — le contenu vit dans Convex, qui a ses propres sauvegardes — et
  # c'est donc la première chose à sauvegarder sur ce VPS. Procédure dans
  # le README §13. `docker compose down -v` le détruit : ne jamais lancer
  # cette commande sur le VPS.
  umami-db:
