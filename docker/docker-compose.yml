# docker/docker-compose.yml — ce qui tourne sur le VPS (spec §7).
# Aucune image n'est construite ici : la CI les pousse sur GHCR et ce
# fichier ne fait que les tirer, à un tag précis. C'est ce qui rend le
# rollback exécutable — `IMAGE_TAG` est un sha de commit, pas `latest`.
name: astrotan

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Lecture seule : Traefik n'a besoin que de lire les labels des
      # conteneurs. Un socket Docker monté en écriture équivaut à donner
      # le root de l'hôte au conteneur.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    # NE JAMAIS AJOUTER DE `command:` NI DE `traefik.yml` MONTÉ ICI.
    #
    # Traefik charge sa configuration statique par trois loaders essayés
    # dans l'ordre File → Flag → Env, et le PREMIER qui aboutit arrête la
    # chaîne : les sources ne sont pas fusionnées. Un fichier monté sur
    # `/etc/traefik/traefik.yml`, ou un seul argument de ligne de commande,
    # ferait donc ignorer EN SILENCE toutes les variables `TRAEFIK_*`
    # ci-dessous — Traefik démarrerait sans ACME, sans provider docker et
    # sans redirection, sans le moindre message d'erreur.
    #
    # Vérifié sur traefik:v3.6 (3.6.25) : avec `TRAEFIK_LOG_LEVEL=DEBUG`
    # dans l'environnement et le seul flag `--accesslog=true` en `command`,
    # le conteneur ne produit aucune ligne DBG — le niveau reste au défaut
    # ERROR. Pour ajouter un réglage, ajouter une variable, jamais un flag.
    #
    # Les noms suivent les flags `traefik --help` : `--entrypoints.<nom>.
    # address` devient `TRAEFIK_ENTRYPOINTS_<NOM>_ADDRESS`. Le nom du
    # résolveur (`letsencrypt`) est arbitraire mais doit rester identique
    # aux labels `traefik.http.routers.*.tls.certresolver` plus bas.
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT: "true"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_PROVIDERS_DOCKER: "true"
      # Aucun conteneur n'est exposé sans un label `traefik.enable=true`.
      # Le défaut inverse publierait sur internet tout conteneur de l'hôte.
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: astrotan_edge
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # `/ping` sur l'entrypoint interne `traefik` (port 8080), seule cible
      # du healthcheck ci-dessous. Cet entrypoint n'est pas dans `ports:` :
      # il reste joignable depuis le conteneur seulement. Ni l'API ni le
      # dashboard ne sont activés — un dashboard Traefik ouvert publierait
      # la topologie complète du VPS.
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: traefik
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_ACCESSLOG: "true"
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/astrotan-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    # Un seul réplica, et ce n'est pas un réglage de capacité : le cache
    # d'Astro est `memoryCache()`, par processus. Une seconde instance
    # continuerait de servir du contenu périmé jusqu'à `maxAge` après
    # chaque publication, parce que le POST `/api/revalidate` n'atteint
    # qu'un seul processus (spec §6.2 ; le commentaire final de
    # apps/web/src/pages/api/revalidate.ts). Monter ce nombre exige
    # d'abord un provider de cache partagé.
    deploy:
      replicas: 1
    environment:
      # Secrets d'exécution, jamais dans l'image (contrainte globale) :
      # `.env` du VPS, jamais commité.
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # `PUBLIC_CONVEX_URL` n'apparaît pas ici : Astro l'a figée dans le
      # bundle au build (build-arg). La changer impose de reconstruire.
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: Host(`${WEB_DOMAIN:?WEB_DOMAIN is required}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: letsencrypt
      traefik.http.services.web.loadbalancer.server.port: "4321"

  admin:
    image: ghcr.io/${GHCR_OWNER}/astrotan-admin:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Les mêmes valeurs qu'en build-arg, et pour une autre raison :
      # `src/lib/auth-server.ts` les lit par `process.env` au runtime,
      # tandis que `src/router.tsx` lit la copie figée par Vite. Les deux
      # sont nécessaires (voir docker/admin.Dockerfile, Task 5).
      VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
      VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:?VITE_CONVEX_SITE_URL is required}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: Host(`${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}`)
      traefik.http.routers.admin.entrypoints: websecure
      traefik.http.routers.admin.tls.certresolver: letsencrypt
      traefik.http.services.admin.loadbalancer.server.port: "3000"

networks:
  edge:
    name: astrotan_edge

volumes:
  # Stockage des certificats Let's Encrypt (`/acme/acme.json`). Volume
  # NOMMÉ, et pas un bind-mount depuis l'hôte : Traefik refuse de démarrer
  # si le fichier est trop permissif (« permissions 660 for acme.json are
  # too open, please use 600 »), et un fichier créé côté hôte arrive avec
  # les droits et le propriétaire de l'hôte, pas ceux attendus dans le
  # conteneur. Le volume nommé laisse Traefik créer le fichier lui-même,
  # en 600, sans intervention.
  #
  # Sa persistance est aussi ce qui protège le quota Let's Encrypt : sans
  # elle, un conteneur qui redémarre en boucle redemanderait un certificat
  # à chaque tour et brûlerait les 5 certificats/7 jours en quelques
  # minutes. Ne pas le supprimer pour « repartir propre » (voir
  # `ACME_CA_SERVER` dans `.env.example` pour tester sans risque).
  acme:
