name: Deploy

on:
  push:
    branches: [main]
  # Permet de rejouer un déploiement sans commit vide.
  workflow_dispatch:

# Un déploiement à la fois, et jamais annulé en cours de route : une image
# poussée puis abandonnée entre `convex deploy` et le `compose up` laisse
# le backend en avance sur les conteneurs.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ÉTAPE 1 DU PIPELINE (spec §7) — obligatoirement avant le build des
      # images : `apps/web` prérend `src/pages/index.astro`, qui interroge
      # Convex. Construire l'image d'abord ferait lire au build un schéma
      # qui n'existe pas encore.
      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @astrotan/backend exec convex deploy

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Règle tenue dans tout ce fichier : rien de `${{ … }}` n'apparaît dans
      # le CORPS d'un `run:`. Les valeurs passent par le `env:` du step et
      # sont lues en `"$VAR"`. Pour les secrets c'est la pratique recommandée
      # par GitHub — interpolé, un secret est substitué TEXTUELLEMENT dans le
      # script avant exécution, donc son contenu devient du shell. Pour le
      # reste (`github.*`, `inputs.*`) c'est la même règle, appliquée
      # uniformément pour qu'on n'ait pas à se demander, ligne par ligne, ce
      # qui est du code et ce qui est de la donnée.
      - name: Compute the lowercase image prefix
        id: img
        # GHCR n'accepte que des noms de dépôt en minuscules, alors que le
        # propriétaire GitHub peut contenir des majuscules.
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "prefix=ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Seules des valeurs PUBLIQUES passent en build-arg (contrainte
      # globale du lot) : Vite et Astro les figent dans le bundle, donc un
      # secret qui passerait ici serait lisible dans l'image. Les vrais
      # secrets du site — `PREVIEW_SECRET`, `REVALIDATE_SECRET` — ne sont
      # fournis qu'à l'exécution, par le `.env` du VPS.
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            PUBLIC_CONVEX_URL=${{ secrets.PUBLIC_CONVEX_URL }}
            PUBLIC_UMAMI_URL=${{ secrets.PUBLIC_UMAMI_URL }}
            PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ steps.img.outputs.prefix }}/astrotan-web:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/astrotan-web:latest
          # `scope` obligatoire dès qu'un workflow construit plus d'une image.
          # Le cache GHA est indexé par scope, et le scope par défaut est
          # `buildkit` pour TOUT LE MONDE : sans ces deux lignes, le build
          # `admin` ci-dessous écrit son cache par-dessus celui de `web`, et
          # `web` fait pareil au run suivant. Les deux images se retrouvent à
          # ne jamais réutiliser que le cache de l'autre, donc à tout
          # reconstruire, à chaque exécution (docker/build-push-action#867).
          cache-from: type=gha,scope=deploy-web
          cache-to: type=gha,mode=max,scope=deploy-web

      - name: Build and push the admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: true
          build-args: |
            VITE_CONVEX_URL=${{ secrets.VITE_CONVEX_URL }}
            VITE_CONVEX_SITE_URL=${{ secrets.VITE_CONVEX_SITE_URL }}
            VITE_WEB_SITE_URL=${{ secrets.VITE_WEB_SITE_URL }}
          tags: |
            ${{ steps.img.outputs.prefix }}/astrotan-admin:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/astrotan-admin:latest
          # Scope distinct de celui du build `web` ci-dessus — voir son
          # commentaire pour la raison.
          cache-from: type=gha,scope=deploy-admin
          cache-to: type=gha,mode=max,scope=deploy-admin

      # La configuration qui tourne sur le VPS vient du dépôt, à chaque
      # déploiement — sinon un compose édité à la main sur la machine
      # diverge en silence, et le rollback ne reproduit plus rien.
      - name: Configure the SSH client
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # La clé d'hôte du VPS, vérifiée à chaque connexion. Jamais
          # `StrictHostKeyChecking=no` : ce serait livrer la clé de
          # déploiement à n'importe quel serveur répondant à cette adresse.
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # `--exclude '.env'` avec `--delete` : le `.env` du VPS n'est ni
      # écrasé ni supprimé. Il porte les variables que la commande
      # ci-dessous ne passe pas — `ACME_EMAIL`, `WEB_DOMAIN`,
      # `ADMIN_DOMAIN`, `PREVIEW_SECRET`, `REVALIDATE_SECRET`,
      # `VITE_CONVEX_URL`, `VITE_CONVEX_SITE_URL` — et que
      # `docker/docker-compose.yml` exige par la syntaxe `${VAR:?message}`.
      # Un VPS amorcé avant que la configuration statique de Traefik ne
      # passe en variables d'environnement n'a pas `ACME_EMAIL` : le
      # premier déploiement après cette bascule échoue en la nommant, et
      # c'est la bonne façon d'échouer (`docker/README.md`, mise à jour).
      - name: Ship the compose stack
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude '.env' \
            docker/ "$VPS_USER@$VPS_HOST:~/astrotan/"

      # ÉTAPE 3 DU PIPELINE — `IMAGE_TAG` est le sha, jamais `latest` : ce
      # qui tourne sur le VPS doit être nommable pour être reproductible.
      # `IMAGE_TAG` et `GHCR_OWNER` sont les deux seules variables passées
      # par la commande ; elles couvrent exactement ce que le déploiement
      # décide et que le `.env` du VPS ne peut pas savoir.
      #
      # `--wait` sur le `up` : sans lui, `up -d` rend la main dès que les
      # conteneurs sont CRÉÉS, sans regarder les healthchecks — un conteneur
      # qui démarre puis meurt donne un job vert et un site mort. Avec
      # `--wait`, compose attend que chaque service soit running|healthy et
      # sort en 1 sur `container <nom> is unhealthy` (mesuré : `up -d` seul
      # renvoie 0 sur un conteneur dont le healthcheck échoue, `up -d --wait`
      # renvoie 1). Le `&&` qui suit n'est donc plus atteint : un déploiement
      # cassé n'écrit pas son sha dans DEPLOYED_SHA et fait échouer le job.
      # `--wait-timeout` n'est pas décoratif : les trois services sont en
      # `restart: unless-stopped`, et un conteneur qui plante puis redémarre
      # en boucle repart à chaque fois dans son `start_period` sans jamais se
      # stabiliser en `unhealthy`. Sans plafond, `--wait` attendrait alors
      # jusqu'au timeout de job GitHub (6 h par défaut) en tenant le verrou
      # de concurrence `deploy`. 180 s couvre largement le pire cas sain
      # (`start_period` 20 s + `interval` 30 s × `retries` 3 = 110 s).
      - name: Pull and restart
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          GHCR_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "cd ~/astrotan \
             && IMAGE_TAG=$IMAGE_TAG GHCR_OWNER=$GHCR_OWNER docker compose pull \
             && IMAGE_TAG=$IMAGE_TAG GHCR_OWNER=$GHCR_OWNER docker compose up -d --wait --wait-timeout 180 \
             && echo $IMAGE_TAG > ~/astrotan/DEPLOYED_SHA \
             && docker image prune -f"

      # Rend la cible d'un éventuel rollback évidente sans fouiller les logs
      # (spec §7 : « le job de déploiement enregistre le sha publié »).
      - name: Record the deployed sha
        # Bloc scalaire et non `run: echo …` sur une ligne : la phrase
        # contient « Rollback: », et un `: ` dans un scalaire simple fait
        # échouer le parseur YAML sur le workflow entier
        # (« mapping values are not allowed here »).
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          echo "Deployed \`$DEPLOYED_SHA\`. Rollback: run the Rollback workflow with the previous sha." >> "$GITHUB_STEP_SUMMARY"
