name: Rollback

# Jamais automatique : un rollback est une décision. `workflow_dispatch`
# avec un sha explicite — celui affiché dans le résumé du déploiement à
# rejouer, ou `cat ~/astrotan/DEPLOYED_SHA` sur le VPS.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit sha complet à redéployer (40 caractères)"
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # L'arbre du sha visé, functions Convex comprises : c'est tout
          # l'objet de ce workflow.
          ref: ${{ inputs.sha }}

      # Même règle que dans `deploy.yml` : rien de `${{ … }}` dans le corps
      # d'un `run:`, tout passe par le `env:` du step et se lit en `"$VAR"`.
      # Ici ce n'est pas qu'une question de style : `inputs.sha` est tapé à la
      # main au lancement du workflow. Interpolé, il serait recollé
      # textuellement dans le script AVANT exécution — donc exécutable. En
      # variable d'environnement il reste une chaîne, y compris pendant la
      # validation ci-dessous, qui est justement ce qui doit tourner en
      # premier.
      - name: Refuser un sha mal formé
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          echo "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || (echo "sha must be a full 40-character commit sha" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # LE POINT ENTIER DE CE WORKFLOW (spec §7). Repointer le compose sur
      # un tag d'image antérieur laisserait un frontend ancien face aux
      # functions Convex actuelles. La discipline expand/migrate/contract
      # rend ce redéploiement des anciennes functions sûr d'un cran en
      # arrière — et c'est exactement d'un cran qu'il s'agit.
      - name: Redeploy the Convex functions of that sha
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @astrotan/backend exec convex deploy

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the lowercase image prefix
        id: img
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "prefix=ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Échouer ici plutôt que sur le VPS, à mi-chemin d'un `compose up`
      # dont un service ne démarrera jamais.
      - name: Vérifier que les deux images de ce sha existent
        env:
          IMG_PREFIX: ${{ steps.img.outputs.prefix }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          docker manifest inspect "$IMG_PREFIX/astrotan-web:$INPUT_SHA" >/dev/null
          docker manifest inspect "$IMG_PREFIX/astrotan-admin:$INPUT_SHA" >/dev/null

      - name: Configure the SSH client
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Comme dans `deploy.yml` : la clé d'hôte est vérifiée, jamais
          # contournée par `StrictHostKeyChecking=no`.
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Le compose du sha visé, pas celui de `main` : rejouer un pipeline,
      # c'est rejouer sa configuration aussi — et depuis que la
      # configuration statique de Traefik vit dans le `environment:` de ce
      # même fichier, c'est bien toute la configuration du reverse proxy
      # qui revient avec lui, sans fichier annexe à synchroniser. Le
      # `.env` du VPS reste intact (`--exclude '.env'`), il porte les
      # variables que la commande ci-dessous ne passe pas.
      - name: Ship the compose stack of that sha
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude '.env' \
            docker/ "$VPS_USER@$VPS_HOST:~/astrotan/"

      # `--wait` comme dans `deploy.yml` : `up -d` seul rend la main dès la
      # création des conteneurs et renvoie 0 même si l'un d'eux meurt aussitôt
      # après. C'est encore moins acceptable ici — un rollback qu'on croit
      # réussi est un incident qu'on croit clos. Avec `--wait`, compose attend
      # running|healthy et sort en 1 sur `container <nom> is unhealthy`, donc
      # DEPLOYED_SHA n'est pas réécrit et le job échoue. `--wait-timeout`
      # pour la même raison que dans `deploy.yml` : en `restart:
      # unless-stopped`, un conteneur en boucle de crash ne se stabilise
      # jamais en `unhealthy` et ferait pendre le job jusqu'au timeout
      # GitHub — en tenant le verrou `deploy`, donc en bloquant le
      # déploiement correctif d'après.
      - name: Pull and restart at that sha
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          IMAGE_TAG: ${{ inputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          GHCR_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "cd ~/astrotan \
             && IMAGE_TAG=$IMAGE_TAG GHCR_OWNER=$GHCR_OWNER docker compose pull \
             && IMAGE_TAG=$IMAGE_TAG GHCR_OWNER=$GHCR_OWNER docker compose up -d --wait --wait-timeout 180 \
             && echo $IMAGE_TAG > ~/astrotan/DEPLOYED_SHA"

      - name: Record the rollback
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          echo "Rolled back to \`$INPUT_SHA\` — Convex functions redeployed from that tree, images repinned." >> "$GITHUB_STEP_SUMMARY"
