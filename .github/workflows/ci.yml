name: CI

# I7 (Lot 1 final review): there was no CI at all before this — a missing
# `await` on an auth guard, a stale `convex/_generated`, or a lint
# regression could only ever be caught by someone remembering to run the
# right command locally. `packages/backend`'s own `codegen` script never
# pushes to a deployment (see its comment in package.json) — it only
# checks that the *committed* `convex/_generated` is present — so this
# workflow needs no Convex credentials or running deployment to do its job.
on:
  push:
    branches: [main, demo]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Les deux moitiés d'une variable d'environnement — celle qui la lit
      # dans `apps/`, celle qui la pose dans le compose, un Dockerfile ou
      # `deploy.yml` — sont le motif qui a produit presque tous les défauts
      # de configuration de ce dépôt : la moitié manquante ne casse rien en
      # développement et donne en production une panne muette. Ce contrôle
      # les met face à face. Il ne dépend d'aucun paquet installé, d'où sa
      # place avant tout le reste : il coûte une seconde et il échoue avec
      # le nom de la variable et le fichier qui la lit.
      - name: Check environment-variable wiring
        run: node scripts/check-env-wiring.mjs

      # Nothing in this workflow ever checked a dependency for a known
      # vulnerability — a `pnpm add` (or a routine bump) could quietly bring
      # one in and nobody would notice until an advisory got read by hand.
      # `--prod` matches the workflow's own security posture: a
      # `devDependency` never ships, so a finding there would fail the build
      # for a risk nobody runs. One advisory is deliberately excluded — see
      # `pnpm-workspace.yaml`'s `auditConfig` for which one and why; this
      # step is expected to run clean, not to carry a standing red X.
      - name: Audit des dépendances de production
        run: corepack pnpm@10 audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # I6/I7 (Lot 1 final review, re-review): typecheck/lint/test never
      # actually run the TanStack Router generator, so a committed
      # `routeTree.gen.ts` that has drifted from `src/routes/**` (a route
      # added or renamed without re-running `dev`/`build` locally before
      # committing) would pass this workflow silently. Building is what
      # regenerates it (the generator only ever runs as a Vite plugin, see
      # `apps/admin/.gitignore`'s own comment on why there's no standalone
      # codegen command for it) — the diff after that build is the actual
      # drift check.
      - name: Build admin (drift-checks routeTree.gen.ts)
        run: pnpm --filter @astrotan/admin build

      - name: Fail if routeTree.gen.ts is out of date
        run: git diff --exit-code -- apps/admin/src/routeTree.gen.ts

  # Job séparé de `ci` : il ne partage ni son installation pnpm ni son
  # cache, et il doit pouvoir échouer sans masquer un échec de test.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pour `scripts/check-env-wiring.mjs` plus bas. Le runner a déjà un
      # Node, mais lequel dépend de l'image du runner : l'épingler ici évite
      # qu'une montée de version d'`ubuntu-latest` change le comportement
      # d'une étape qui n'a rien demandé. Aucune installation de dépendances
      # n'est nécessaire — le script n'en a aucune.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: docker/setup-buildx-action@v3

      # Seule l'image `admin` est construite ici. Celle du site exige un
      # déploiement Convex JOIGNABLE PENDANT LE BUILD (`index.astro` est
      # prérendu et l'interroge) : la construire sur une PR supposerait de
      # donner l'URL de production à des PR venues de forks, où les secrets
      # ne sont de toute façon pas disponibles. Le premier build réel de
      # l'image `web` reste donc celui du workflow Deploy — limite connue,
      # écrite ici plutôt que découverte.
      - name: Build the admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: false
          build-args: |
            VITE_CONVEX_URL=http://ci.invalid
            VITE_CONVEX_SITE_URL=http://ci.invalid
            VITE_WEB_SITE_URL=http://ci.invalid
          # Scope explicite : le cache GHA est indexé par scope et le défaut
          # est `buildkit`, partagé par tous les builds du dépôt. Distinct de
          # `deploy-admin` (workflow Deploy) volontairement — ce build-ci
          # tourne sur chaque PR, avec des build-args bidons (`ci.invalid`),
          # et écrire dans le même scope ferait de chaque PR une réécriture du
          # cache dont dépend le déploiement de `main`, dans les deux sens
          # (docker/build-push-action#867).
          cache-from: type=gha,scope=ci-admin
          cache-to: type=gha,mode=max,scope=ci-admin

      # Les variables de cette validation étaient recopiées à la main ici, et
      # elles avaient déjà divergé : l'arrivée d'Umami a ajouté quatre
      # `${VAR:?}` au compose sans que cette liste bouge, et cette étape
      # échouait donc pour de bon sur `UMAMI_DB_PASSWORD is missing a value`.
      # Elles sont maintenant DÉRIVÉES du compose lui-même — la liste ne peut
      # plus prendre de retard sur le fichier qu'elle est censée valider.
      #
      # Toutes les valeurs produites sont bidon et le restent : ce fichier ne
      # sert qu'à prouver que l'interpolation aboutit. `ACME_CA_SERVER` n'y
      # figure pas — elle a un défaut (`${VAR:-...}`), donc son absence est
      # le cas normal, et c'est bien celui qu'on veut valider.
      - name: Validate the compose file
        run: |
          node scripts/check-env-wiring.mjs --compose-env > compose-ci.env
          docker compose --env-file compose-ci.env -f docker/docker-compose.yml config >/dev/null
